<!DOCTYPE html> <!--Tells the browser that this file is using the coding language html5-->
<html lang="en"> <!--Tells the browser where the root is and that the file is in English-->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Allows the website to be usable on mobile-->
    <title>PlaceholderTabName</title> <!--This is the text that appears for the tab-->
    <link rel="stylesheet" href="style.css"> <!--Connects this file to style.css so it can use it-->
  </head>

  <body>

      <h1>PlaceholderTitle</h1> <!--This is the text for main title-->

    <div class="container"> <!--Centers content and adds padding-->

        <button id="PlaceholderButton">PlaceholderButton1</button> <!--The text for the button-->

      </section>
      
      <div class="grid mt-20"> <!--Creates the grid around the sections-->

          <h2>PlaceholderSection1</h2> <!--The text for the section-->
          <p>PlaceholderContentForSection1</p> <!--The text for the content of the section-->

        </div>
        
        <div class="grid-item"> <!--Creates the card for each section-->

      </div>
    </div>

    <footer>
      <p>PlaceholderFooter</p> <!--Creates the footer at the bottom of the page-->
    </footer>

</html>
